{{- if .Values.grafana.enabled }}
{{- $name := printf "%s-grafana" (include "obs.fullname" .) }}
{{- $prom  := printf "%s-prometheus" (include "obs.fullname" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-provisioning
  labels:
    {{- include "obs.labels" . | nindent 4 }}
data:
  # Datasource + dashboard provider, same as the compose stack's provisioning/ tree.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ $prom }}:9090{{ .Values.prometheus.path }}
        isDefault: true
        editable: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'gravitee'
        orgId: 1
        folder: 'Gravitee'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboards
  labels:
    {{- include "obs.labels" . | nindent 4 }}
data:
  # Dashboards carried over verbatim from docker/quick-setup/keycloak/grafana/dashboards/.
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- if not .Values.grafana.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-admin
  labels:
    {{- include "obs.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ .Values.grafana.adminPassword | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
{{- if .Values.grafana.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size }}
  {{- with .Values.grafana.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "obs.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 472            # grafana user in the official image
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: {{ include "obs.image" (dict "ctx" $ "image" .Values.grafana.image) }}
          env:
            # SERVE_FROM_SUB_PATH + a ROOT_URL containing the sub-path is what makes
            # Grafana work behind /grafana; without both, its assets 404.
            - name: GF_SERVER_ROOT_URL
              value: "{{ if .Values.ingress.enabled }}{{ if .Values.ingress.tls.enabled }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}{{ .Values.grafana.path }}{{ else }}http://localhost:3000{{ end }}"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.existingSecret | default (printf "%s-admin" $name) }}
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.existingSecret | default (printf "%s-admin" $name) }}
                  key: admin-password
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        # The two provisioning dirs come from ONE configmap, split by subPath so each
        # directory contains only the file Grafana expects to find there.
        - name: provisioning-datasources
          configMap:
            name: {{ $name }}-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: provisioning-dashboards
          configMap:
            name: {{ $name }}-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: {{ $name }}-dashboards
        - name: data
          {{- if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
{{ include "obs.ingress" (dict "ctx" . "name" "grafana" "path" .Values.grafana.path "svc" $name "port" 3000) }}
{{- end }}
