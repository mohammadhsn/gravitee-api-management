# ELK phase 2 — ship container logs RAW (no grok parsing).
# Filebeat (beats input) -> Elasticsearch, into daily logs-* indices,
# kept separate from Gravitee's gravitee-* analytics indices.
input {
  beats {
    port => 5044
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }
}
