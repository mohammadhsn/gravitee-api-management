networks:
    frontend:
        name: frontend
    storage:
        name: storage

volumes:
    data-elasticsearch:
    data-kibana:
    data-prometheus:
    data-grafana:
    keycloak_data:
    data-mongo:

services:
    # Edge reverse-proxy: single entrypoint, path-per-service routing (see conf/nginx.conf).
    # depends_on all proxied services so their names resolve when nginx parses proxy_pass.
    nginx:
        image: nginx:latest
        hostname: auth.localhost
        restart: unless-stopped
        depends_on:
            - keycloak
            - management_api
            - management_ui
            - portal_ui
            - gateway
            - kibana
            - grafana
            - prometheus
        ports:
            # 443 is the real edge; 80 only 301-redirects to it. Docker Desktop can bind
            # privileged ports without sudo, so https://localhost/ needs no port suffix
            # and every absolute PUBLIC_BASE_URL stays correct.
            - "${EDGE_PORT:-443}:443"
            - "${EDGE_PORT_HTTP:-80}:80"
        volumes:
            - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
            # Generated by ./generate-certificates.sh (gitignored).
            - ./.certificates:/etc/nginx/certificates:ro
        networks:
            - frontend
            - storage

    keycloak:
        image: quay.io/keycloak/keycloak:26.2.0
        environment:
            - KEYCLOAK_ADMIN=admin
            - KEYCLOAK_ADMIN_PASSWORD=password
            # PROXY_ADDRESS_FORWARDING removed (deprecated in KC 26). Its replacement is
            # KC_PROXY_HEADERS below, and that is the setting that actually matters: KC 26
            # IGNORES X-Forwarded-* unless it is set, so it never saw the request as
            # secure and kept returning "HTTPS required". That is why this stack used to
            # force sslRequired=NONE on every realm. With TLS terminating at nginx AND
            # this variable, KC sees X-Forwarded-Proto: https, treats the connection as
            # secure, and the default sslRequired=external is satisfied -- so the
            # workaround is gone from the keycloak-config sidecar below.
            - KC_PROXY_HEADERS=xforwarded
            - Dkeycloak.profile.feature.upload_scripts="enabled"
            # Pin the issuer to a single fixed value. Without this, KC's dynamic hostname
            # stamps tokens with whatever host minted them (localhost:8080 via the browser),
            # then rejects them at userinfo when the management-api calls in via keycloak:8080
            # ("Token verification failed"). Fixed hostname + non-dynamic backchannel makes
            # every request validate against the same issuer regardless of the Host header.
            # Behind the edge proxy at /auth: issuer + relative path both under /auth.
            - KC_HOSTNAME=${PUBLIC_BASE_URL}/auth
            - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=false
            - KC_HTTP_RELATIVE_PATH=/auth
        restart: always
        # No published port — reached only via the edge proxy at ${PUBLIC_BASE_URL}/auth
        volumes:
            # KC 26 `--import-realm` only reads /opt/keycloak/data/import/, not /tmp.
            - ./realm/realm-gio.json:/opt/keycloak/data/import/realm-gio.json
            - keycloak_data:/opt/keycloak/data
        networks:
            - frontend
        entrypoint: ["/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]

    # One-shot: point the gravitee-client redirect URIs / web origins at the
    # public host. Keycloak does NOT substitute env vars in realm imports (the
    # realm file is full of its own ${...} i18n placeholders), so this can't be
    # baked into realm-gio.json. Runs on every `up`; idempotent. Reuses the
    # cached Keycloak image purely for kcadm.sh — no extra image to pull.
    keycloak-config:
        image: quay.io/keycloak/keycloak:26.2.0
        depends_on:
            keycloak:
                condition: service_started
        environment:
            - PUBLIC_CONSOLE_URL=${PUBLIC_BASE_URL}/console
            - PUBLIC_PORTAL_URL=${PUBLIC_BASE_URL}/devportal
        entrypoint:
            - /bin/sh
            - -c
            - |
                set -e
                KC=/opt/keycloak/bin/kcadm.sh
                echo "waiting for keycloak admin api..."
                until $$KC config credentials --server http://keycloak:8080/auth --realm master --user admin --password password >/dev/null 2>&1; do
                    sleep 5
                done
                # NOTE: sslRequired=NONE used to be forced on both realms here. It is no
                # longer needed -- the edge terminates TLS and KC_PROXY_HEADERS=xforwarded
                # lets Keycloak see the connection as secure, so the shipped default
                # (sslRequired=external) is satisfied. Re-adding it would silently allow
                # plaintext auth, so don't.
                CID=$$($$KC get clients -r gio -q clientId=gravitee-client --fields id --format csv --noquotes | head -n1)
                $$KC update clients/$$CID -r gio \
                    -s "redirectUris=[\"$$PUBLIC_CONSOLE_URL/*\",\"$$PUBLIC_PORTAL_URL/*\"]" \
                    -s "webOrigins=[\"$$PUBLIC_CONSOLE_URL\",\"$$PUBLIC_PORTAL_URL\"]"
                echo "gravitee-client redirect URIs set to $$PUBLIC_CONSOLE_URL /* and $$PUBLIC_PORTAL_URL /*"
        restart: "no"
        networks:
            - frontend

    mongodb:
        image: mongo:${MONGODB_VERSION:-6.0}
        restart: always
        volumes:
            - data-mongo:/data/db
            - ./.logs/apim-mongodb:/var/log/mongodb
        healthcheck:
            test: mongosh --eval 'db.runCommand({serverStatus:1}).ok' --quiet | grep 1
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - storage

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.2}
        restart: always
        volumes:
            - data-elasticsearch:/usr/share/elasticsearch/data
        environment:
            - http.host=0.0.0.0
            - transport.host=0.0.0.0
            - xpack.security.enabled=false
            - cluster.name=elasticsearch
            - bootstrap.memory_lock=true
            - discovery.type=single-node
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile: 65536
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - storage

    # ELK phase 1: query the ES state (Gravitee analytics: gravitee-request-*, gravitee-log-*,
    # gravitee-monitor-*, gravitee-health-*). No auth — ES has xpack.security disabled.
    kibana:
        image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION:-8.17.2}
        restart: always
        depends_on:
            elasticsearch:
                condition: service_healthy
        environment:
            ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
            # Served behind the edge proxy under /kibana
            SERVER_BASEPATH: /kibana
            SERVER_REWRITEBASEPATH: "true"
        volumes:
            - data-kibana:/usr/share/kibana/data
        networks:
            - storage

    # ELK phase 2: ship ALL container logs -> Logstash -> ES (logs-* daily indices), raw.
    logstash:
        image: docker.elastic.co/logstash/logstash:${LOGSTASH_VERSION:-8.17.2}
        restart: always
        depends_on:
            elasticsearch:
                condition: service_healthy
        environment:
            - LS_JAVA_OPTS=-Xms512m -Xmx512m
        volumes:
            - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
            - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
        networks:
            - storage

    filebeat:
        image: docker.elastic.co/beats/filebeat:${FILEBEAT_VERSION:-8.17.2}
        restart: always
        user: root
        # --strict.perms=false: Filebeat otherwise refuses a bind-mounted config it deems world-writable.
        command: ["filebeat", "-e", "--strict.perms=false"]
        depends_on:
            - logstash
        volumes:
            - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - storage

    # Monitoring: scrape Gravitee node metrics (gateway:18082, management_api:18083).
    prometheus:
        image: prom/prometheus:${PROMETHEUS_VERSION:-v2.53.2}
        restart: always
        # external-url sets the sub-path (/prometheus) it serves + advertises behind the edge proxy.
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
            - "--web.external-url=${PUBLIC_BASE_URL}/prometheus"
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - data-prometheus:/prometheus
        networks:
            - storage

    # Monitoring dashboards on top of Prometheus (datasource auto-provisioned).
    grafana:
        image: grafana/grafana:${GRAFANA_VERSION:-11.3.1}
        restart: always
        depends_on:
            - prometheus
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            # Served behind the edge proxy under /grafana
            - GF_SERVER_ROOT_URL=${PUBLIC_BASE_URL}/grafana
            - GF_SERVER_SERVE_FROM_SUB_PATH=true
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
            - data-grafana:/var/lib/grafana
        networks:
            - storage

    gateway:
        image: ${APIM_REGISTRY:-graviteeio}/apim-gateway:${APIM_VERSION:-4.11.6}
        restart: always
        # No published port — reached via the edge proxy at the root ${PUBLIC_BASE_URL}/
        depends_on:
            mongodb:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
            keycloak:
                condition: service_started
        volumes:
            - ./.logs/apim-gateway:/opt/graviteeio-gateway/logs
            - ./.plugins:/opt/graviteeio-gateway/plugins-ext
            - ./.license:/opt/graviteeio-gateway/license
        environment:
            - gravitee_management_mongodb_uri=mongodb://mongodb:27017/gravitee?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
            - gravitee_ratelimit_mongodb_uri=mongodb://mongodb:27017/gravitee?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
            - gravitee_reporters_elasticsearch_endpoints_0=http://elasticsearch:9200
            # Expose Prometheus metrics on the node API (gateway:18082/_node/metrics/prometheus).
            # host=0.0.0.0 so Prometheus (another container) can reach it — default binds localhost.
            - gravitee_services_core_http_host=0.0.0.0
            - gravitee_services_metrics_enabled=true
            - gravitee_plugins_path_0=$${gravitee.home}/plugins
            - gravitee_plugins_path_1=$${gravitee.home}/plugins-ext
        networks:
            - storage
            - frontend

    management_api:
        image: ${APIM_REGISTRY:-graviteeio}/apim-management-api:${APIM_VERSION:-4.11.6}
        restart: always
        # No published port — REST APIs reached via the edge proxy at /management and /portal
        links:
            - mongodb
            - elasticsearch
        depends_on:
            mongodb:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
        volumes:
            - ./.logs/apim-management-api:/opt/graviteeio-management-api/logs
            - ./.plugins:/opt/graviteeio-management-api/plugins-ext
            - ./.license:/opt/graviteeio-management-api/license
        environment:
            - gravitee_management_mongodb_uri=mongodb://mongodb:27017/gravitee?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
            - gravitee_analytics_elasticsearch_endpoints_0=http://elasticsearch:9200
            # Expose Prometheus metrics on the node API (management_api:18083/_node/metrics/prometheus).
            # host=0.0.0.0 so Prometheus (another container) can reach it — default binds localhost.
            - gravitee_services_core_http_host=0.0.0.0
            - gravitee_services_metrics_enabled=true
            - gravitee_plugins_path_0=$${gravitee.home}/plugins
            - gravitee_plugins_path_1=$${gravitee.home}/plugins-ext
            - gravitee_security_providers_2_type=oidc
            - gravitee_security_providers_2_id=keycloak
            - gravitee_security_providers_2_clientId=gravitee-client
            - gravitee_security_providers_2_clientSecret=00dc0118-2a0d-4249-86a3-3e133f5de145
            # Server-to-server endpoints: called by THIS container, so they must use the
            # in-network hostname `keycloak:8080`, not localhost (which is the container itself).
            # Backchannel: in-network, Keycloak is under /auth (KC_HTTP_RELATIVE_PATH).
            - gravitee_security_providers_2_tokenEndpoint=http://keycloak:8080/auth/realms/gio/protocol/openid-connect/token
            - gravitee_security_providers_2_tokenIntrospectionEndpoint=http://keycloak:8080/auth/realms/gio/protocol/openid-connect/token/introspect
            - gravitee_security_providers_2_userInfoEndpoint=http://keycloak:8080/auth/realms/gio/protocol/openid-connect/userinfo
            # Browser-facing endpoints: via the edge proxy at ${PUBLIC_BASE_URL}/auth
            - gravitee_security_providers_2_authorizeEndpoint=${PUBLIC_BASE_URL}/auth/realms/gio/protocol/openid-connect/auth
            - gravitee_security_providers_2_userLogoutEndpoint=${PUBLIC_BASE_URL}/auth/realms/gio/protocol/openid-connect/logout
            - gravitee_security_providers_2_color=#0076b4
            - gravitee_security_providers_2_syncMappings=false
            - gravitee_security_providers_2_scopes_0=openid
            - gravitee_security_providers_2_scopes_1=profile
            - gravitee_security_providers_2_userMapping_id=sub
            - gravitee_security_providers_2_userMapping_email=email
            - gravitee_security_providers_2_userMapping_lastname=lastname
            - gravitee_security_providers_2_userMapping_firstname=family_name
            - gravitee_security_providers_2_userMapping_picture=picture
            # Per-env URL overrides for the Console/Portal "installation access" URLs.
            # DISABLED: Gravitee validates the URL HOST as a DNS domain name (Guava
            # InternetDomainName) and REJECTS IP literals — with a raw-IP PUBLIC_BASE_URL
            # the management-api crashes at boot ("Installation 'console' url '<ip>' is
            # malformed"). An empty value also fails, so these must be omitted, not blank.
            # Re-enable ONLY when PUBLIC_BASE_URL is a DNS hostname (login is unaffected —
            # it uses the OIDC endpoints above, not these).
            # - gravitee_installation_standalone_portal_urls_0_envId=DEFAULT
            # - gravitee_installation_standalone_portal_urls_0_url=${PUBLIC_BASE_URL}/devportal
            # - gravitee_installation_standalone_console_urls_0_orgId=DEFAULT
            # - gravitee_installation_standalone_console_urls_0_url=${PUBLIC_BASE_URL}/console
            # Gateway entrypoint advertised in the portal's Try-It-Out / curl snippets.
            # SYSTEM-scope override of Key.PORTAL_ENTRYPOINT (default placeholder is
            # "https://api.company.com"). Point this at your gateway's public URL.
            - gravitee_portal_entrypoint=${PUBLIC_BASE_URL}/
        networks:
            - storage
            - frontend

    management_ui:
        image: ${APIM_REGISTRY:-graviteeio}/apim-management-ui:${APIM_VERSION:-4.11.6}
        restart: always
        # No published port — served via the edge proxy under /console/
        depends_on:
            - management_api
        environment:
            - CONSOLE_BASE_HREF=/console/
            - MGMT_API_URL=${PUBLIC_BASE_URL}/management/
        volumes:
            - ./.logs/apim-management-ui:/var/log/nginx
        networks:
            - frontend

    portal_ui:
        image: docker.io/mohammadhsn/gravitee-portal-ui-fa:latest
        restart: always
        # No published port — served via the edge proxy under /devportal/
        depends_on:
            - management_api
        environment:
            - PORTAL_BASE_HREF=/devportal/
            - PORTAL_API_URL=${PUBLIC_BASE_URL}/portal
        volumes:
            - ./.logs/apim-portal-ui:/var/log/nginx
        networks:
            - frontend
    service-b:
        image: docker.io/mohammadhsn/service-b:latest
        restart: always
        # No published port — internal backend reached by the gateway.
        # NOTE: issuer is now ${PUBLIC_BASE_URL}/auth/realms/master, but the pushed image
        # still has a hardcoded issuer and ignores KEYCLOAK_ISSUER_URL — needs a rebuild+push
        # (deferred). Until then /protected will 401.
        environment:
            - KEYCLOAK_ISSUER_URL=${PUBLIC_BASE_URL}/auth
        networks:
            - frontend
