# /etc/nginx/conf.d/gravitee.conf
#
# Reverse proxy for Gravitee API Management running via docker-compose on the
# same host. Compose bindings (host:container):
#   gateway          8082:8082
#   management_api   8083:8083   (serves /management and /portal paths)
#   management_ui    8084:8080   (Console SPA)
#   portal_ui        8085:8080   (Developer Portal SPA)
#
# Three vhosts:
#   gateway.example.com   -> Gateway (runtime API traffic)
#   console.example.com   -> Console SPA + Management REST under /management
#   portal.example.com    -> Portal SPA + Portal REST under /portal
#
# TLS certs are assumed to be provisioned by certbot at the standard path.

# ---------- Shared TLS / proxy defaults ----------------------------------

# Apply once globally, or paste into each server block.
# (If you already have these in nginx.conf, drop the duplicates.)

# SSE / chunked responses must not be buffered.
proxy_http_version 1.1;
proxy_buffering    off;
proxy_request_buffering off;

# Forwarded headers
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Websocket / upgrade support (used by some V4 entrypoints + Keycloak login).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Common SSL config — point ssl_certificate / ssl_certificate_key per server.
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1h;

# Gateway can stream large payloads / SSE / long-lived connections.
client_max_body_size 50m;
proxy_read_timeout   3600s;
proxy_send_timeout   3600s;


# =========================================================================
# 1) GATEWAY — runtime API traffic
# =========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name gateway.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.example.com;

    ssl_certificate     /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8082;
    }
}


# =========================================================================
# 2) CONSOLE — admin UI + Management REST
# =========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name console.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.example.com;

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;

    # REST API used by the Console SPA.
    # Matches MGMT_API_URL=https://console.example.com/management/
    location /management/ {
        proxy_pass http://127.0.0.1:8083;
    }

    # SPA static assets.
    location / {
        proxy_pass http://127.0.0.1:8084;
    }
}


# =========================================================================
# 3) DEVELOPER PORTAL — UI + Portal REST
# =========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name portal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.example.com;

    ssl_certificate     /etc/letsencrypt/live/portal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.com/privkey.pem;

    # Portal REST API.
    # Matches PORTAL_API_URL=https://portal.example.com/portal
    location /portal/ {
        proxy_pass http://127.0.0.1:8083;
    }

    # SPA static assets.
    location / {
        proxy_pass http://127.0.0.1:8085;
    }
}
