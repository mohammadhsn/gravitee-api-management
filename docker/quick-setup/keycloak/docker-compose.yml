networks:
    frontend:
        name: frontend
    storage:
        name: storage

volumes:
    data-elasticsearch:
    data-kibana:
    keycloak_data:
    data-mongo:

services:
    nginx:
        image: nginx:latest
        hostname: auth.localhost
        restart: unless-stopped
        depends_on:
            - keycloak
        ports:
            - "80:80"
        volumes:
            - ./conf/nginx.conf:/etc/nginx/nginx.conf
        networks:
            - frontend

    keycloak:
        image: quay.io/keycloak/keycloak:26.2.0
        environment:
            - KEYCLOAK_ADMIN=admin
            - KEYCLOAK_ADMIN_PASSWORD=password
            # PROXY_ADDRESS_FORWARDING removed (deprecated in KC 26). NOTE: removing it did
            # NOT by itself fix the "HTTPS required" error — KC still resolves an external
            # client IP. The actual fix is sslRequired=NONE, applied per-realm (incl. master)
            # by the keycloak-config sidecar below.
            - Dkeycloak.profile.feature.upload_scripts="enabled"
            # Pin the issuer to a single fixed value. Without this, KC's dynamic hostname
            # stamps tokens with whatever host minted them (localhost:8080 via the browser),
            # then rejects them at userinfo when the management-api calls in via keycloak:8080
            # ("Token verification failed"). Fixed hostname + non-dynamic backchannel makes
            # every request validate against the same issuer regardless of the Host header.
            - KC_HOSTNAME=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${KC_PORT}
            - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=false
        restart: always
        ports:
            - ${KC_PORT}:8080
        volumes:
            # KC 26 `--import-realm` only reads /opt/keycloak/data/import/, not /tmp.
            - ./realm/realm-gio.json:/opt/keycloak/data/import/realm-gio.json
            - keycloak_data:/opt/keycloak/data
        networks:
            - frontend
        entrypoint: ["/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]

    # One-shot: point the gravitee-client redirect URIs / web origins at the
    # public host. Keycloak does NOT substitute env vars in realm imports (the
    # realm file is full of its own ${...} i18n placeholders), so this can't be
    # baked into realm-gio.json. Runs on every `up`; idempotent. Reuses the
    # cached Keycloak image purely for kcadm.sh — no extra image to pull.
    keycloak-config:
        image: quay.io/keycloak/keycloak:26.2.0
        depends_on:
            keycloak:
                condition: service_started
        environment:
            - PUBLIC_CONSOLE_URL=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${CONSOLE_PORT}
            - PUBLIC_PORTAL_URL=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${PORTAL_PORT}
        entrypoint:
            - /bin/sh
            - -c
            - |
                set -e
                KC=/opt/keycloak/bin/kcadm.sh
                echo "waiting for keycloak admin api..."
                until $$KC config credentials --server http://keycloak:8080 --realm master --user admin --password password >/dev/null 2>&1; do
                    sleep 5
                done
                # HTTP demo: don't require HTTPS on any realm. 'master' is NOT file-managed,
                # so it MUST be set here — otherwise a `down -v` reverts it to 'external' and
                # the admin console + master token endpoint return "HTTPS required" over HTTP.
                $$KC update realms/master -s sslRequired=NONE
                $$KC update realms/gio -s sslRequired=NONE
                echo "sslRequired=NONE set on master and gio"
                CID=$$($$KC get clients -r gio -q clientId=gravitee-client --fields id --format csv --noquotes | head -n1)
                $$KC update clients/$$CID -r gio \
                    -s "redirectUris=[\"$$PUBLIC_CONSOLE_URL/*\",\"$$PUBLIC_PORTAL_URL/*\"]" \
                    -s "webOrigins=[\"$$PUBLIC_CONSOLE_URL\",\"$$PUBLIC_PORTAL_URL\"]"
                echo "gravitee-client redirect URIs set to $$PUBLIC_CONSOLE_URL /* and $$PUBLIC_PORTAL_URL /*"
        restart: "no"
        networks:
            - frontend

    mongodb:
        image: mongo:${MONGODB_VERSION:-6.0}
        restart: always
        ports:
            - "27017:27017"
        volumes:
            - data-mongo:/data/db
            - ./.logs/apim-mongodb:/var/log/mongodb
        healthcheck:
            test: mongosh --eval 'db.runCommand({serverStatus:1}).ok' --quiet | grep 1
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - storage

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.2}
        restart: always
        volumes:
            - data-elasticsearch:/usr/share/elasticsearch/data
        environment:
            - http.host=0.0.0.0
            - transport.host=0.0.0.0
            - xpack.security.enabled=false
            - cluster.name=elasticsearch
            - bootstrap.memory_lock=true
            - discovery.type=single-node
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile: 65536
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - storage

    # ELK phase 1: query the ES state (Gravitee analytics: gravitee-request-*, gravitee-log-*,
    # gravitee-monitor-*, gravitee-health-*). No auth — ES has xpack.security disabled.
    kibana:
        image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION:-8.17.2}
        restart: always
        depends_on:
            elasticsearch:
                condition: service_healthy
        environment:
            ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
        ports:
            - "${KIBANA_PORT:-5601}:5601"
        volumes:
            - data-kibana:/usr/share/kibana/data
        networks:
            - storage

    # ELK phase 2: ship ALL container logs -> Logstash -> ES (logs-* daily indices), raw.
    logstash:
        image: docker.elastic.co/logstash/logstash:${LOGSTASH_VERSION:-8.17.2}
        restart: always
        depends_on:
            elasticsearch:
                condition: service_healthy
        environment:
            - LS_JAVA_OPTS=-Xms512m -Xmx512m
        volumes:
            - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
            - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
        networks:
            - storage

    filebeat:
        image: docker.elastic.co/beats/filebeat:${FILEBEAT_VERSION:-8.17.2}
        restart: always
        user: root
        # --strict.perms=false: Filebeat otherwise refuses a bind-mounted config it deems world-writable.
        command: ["filebeat", "-e", "--strict.perms=false"]
        depends_on:
            - logstash
        volumes:
            - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - storage

    gateway:
        image: ${APIM_REGISTRY:-graviteeio}/apim-gateway:${APIM_VERSION:-4.11.6}
        restart: always
        ports:
            - "${GW_PORT}:8082"
        depends_on:
            mongodb:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
            keycloak:
                condition: service_started
        links:
            - nginx:auth.localhost
        volumes:
            - ./.logs/apim-gateway:/opt/graviteeio-gateway/logs
            - ./.plugins:/opt/graviteeio-gateway/plugins-ext
            - ./.license:/opt/graviteeio-gateway/license
        environment:
            - gravitee_management_mongodb_uri=mongodb://mongodb:27017/gravitee?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
            - gravitee_ratelimit_mongodb_uri=mongodb://mongodb:27017/gravitee?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
            - gravitee_reporters_elasticsearch_endpoints_0=http://elasticsearch:9200
            - gravitee_plugins_path_0=$${gravitee.home}/plugins
            - gravitee_plugins_path_1=$${gravitee.home}/plugins-ext
        networks:
            - storage
            - frontend

    management_api:
        image: ${APIM_REGISTRY:-graviteeio}/apim-management-api:${APIM_VERSION:-4.11.6}
        restart: always
        ports:
            - "${API_PORT}:8083"
        links:
            - mongodb
            - elasticsearch
        depends_on:
            mongodb:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
        volumes:
            - ./.logs/apim-management-api:/opt/graviteeio-management-api/logs
            - ./.plugins:/opt/graviteeio-management-api/plugins-ext
            - ./.license:/opt/graviteeio-management-api/license
        environment:
            - gravitee_management_mongodb_uri=mongodb://mongodb:27017/gravitee?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
            - gravitee_analytics_elasticsearch_endpoints_0=http://elasticsearch:9200
            - gravitee_plugins_path_0=$${gravitee.home}/plugins
            - gravitee_plugins_path_1=$${gravitee.home}/plugins-ext
            - gravitee_security_providers_2_type=oidc
            - gravitee_security_providers_2_id=keycloak
            - gravitee_security_providers_2_clientId=gravitee-client
            - gravitee_security_providers_2_clientSecret=00dc0118-2a0d-4249-86a3-3e133f5de145
            # Server-to-server endpoints: called by THIS container, so they must use the
            # in-network hostname `keycloak:8080`, not localhost (which is the container itself).
            - gravitee_security_providers_2_tokenEndpoint=http://keycloak:8080/realms/gio/protocol/openid-connect/token
            - gravitee_security_providers_2_tokenIntrospectionEndpoint=http://keycloak:8080/realms/gio/protocol/openid-connect/token/introspect
            - gravitee_security_providers_2_userInfoEndpoint=http://keycloak:8080/realms/gio/protocol/openid-connect/userinfo
            # Browser-facing endpoints: resolved by the user's browser, so they use the public host.
            - gravitee_security_providers_2_authorizeEndpoint=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${KC_PORT}/realms/gio/protocol/openid-connect/auth
            - gravitee_security_providers_2_userLogoutEndpoint=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${KC_PORT}/realms/gio/protocol/openid-connect/logout
            - gravitee_security_providers_2_color=#0076b4
            - gravitee_security_providers_2_syncMappings=false
            - gravitee_security_providers_2_scopes_0=openid
            - gravitee_security_providers_2_scopes_1=profile
            - gravitee_security_providers_2_userMapping_id=sub
            - gravitee_security_providers_2_userMapping_email=email
            - gravitee_security_providers_2_userMapping_lastname=lastname
            - gravitee_security_providers_2_userMapping_firstname=family_name
            - gravitee_security_providers_2_userMapping_picture=picture
            # Per-env URL overrides for the Console/Portal "installation access" URLs.
            # DISABLED for raw-IP deployments: Gravitee validates the URL HOST as a DNS
            # domain name (Guava InternetDomainName) and REJECTS IP literals — so with
            # PUBLIC_HOST set to an IP (e.g. 192.168.8.22) the management-api crashes at
            # boot: "Installation 'console' url '<ip>' is malformed". (localhost passes.)
            # An empty value also fails validation, so these must be omitted, not blank.
            # Re-enable ONLY when PUBLIC_HOST is a DNS hostname; with a raw IP leave them
            # off — the Console UI / defaults are used instead (login is unaffected; it
            # uses the OIDC endpoints above, not these).
            # - gravitee_installation_standalone_portal_urls_0_envId=DEFAULT
            # - gravitee_installation_standalone_portal_urls_0_url=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${PORTAL_PORT}
            # - gravitee_installation_standalone_console_urls_0_orgId=DEFAULT
            # - gravitee_installation_standalone_console_urls_0_url=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${CONSOLE_PORT}
            # Gateway entrypoint advertised in the portal's Try-It-Out / curl snippets.
            # SYSTEM-scope override of Key.PORTAL_ENTRYPOINT (default placeholder is
            # "https://api.company.com"). Point this at your gateway's public URL.
            - gravitee_portal_entrypoint=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${GW_PORT}
        networks:
            - storage
            - frontend

    management_ui:
        image: ${APIM_REGISTRY:-graviteeio}/apim-management-ui:${APIM_VERSION:-4.11.6}
        restart: always
        ports:
            - "${CONSOLE_PORT}:8080"
        depends_on:
            - management_api
        environment:
            - MGMT_API_URL=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${API_PORT}/management/
        volumes:
            - ./.logs/apim-management-ui:/var/log/nginx
        networks:
            - frontend

    portal_ui:
        image: gravitee-portal-ui-fa:latest
        restart: always
        ports:
            - "${PORTAL_PORT}:8080"
        depends_on:
            - management_api
        environment:
            - PORTAL_API_URL=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${API_PORT}/portal
        volumes:
            - ./.logs/apim-portal-ui:/var/log/nginx
        networks:
            - frontend
    service-b:
        image: service-b:latest
        restart: always
        ports:
            - "5000:5000"
        environment:
            # Issuer that service-b validates tokens against — must equal Keycloak's
            # KC_HOSTNAME (the 'iss' every token carries). JWKS is still fetched over
            # the internal keycloak:8080 (default in config.py).
            - KEYCLOAK_ISSUER_URL=${PUBLIC_SCHEME}://${PUBLIC_HOST}:${KC_PORT}
        networks:
            - frontend
