worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # OIDC/Keycloak can emit large headers; give proxying room.
    proxy_buffer_size   16k;
    proxy_buffers       8 16k;
    large_client_header_buffers 4 16k;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Shared proxy headers (so backends see the real host/scheme).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    server {
        listen 80;
        server_name _;

        # ---- Keycloak: served under /auth (KC_HTTP_RELATIVE_PATH). Preserve path. ----
        location = /auth { return 302 /auth/; }
        location /auth/ {
            proxy_pass http://keycloak:8080;
        }

        # ---- Console SPA: strip /console/ (base-href=/console/). ----
        location = /console { return 302 /console/; }
        location /console/ {
            proxy_pass http://management_ui:8080/;
        }

        # ---- Developer Portal SPA: strip /devportal/ (base-href=/devportal/). ----
        location = /devportal { return 302 /devportal/; }
        location /devportal/ {
            proxy_pass http://portal_ui:8080/;
        }

        # ---- Management REST API (Console backend): native /management, preserve. ----
        location /management {
            proxy_pass http://management_api:8083;
        }

        # ---- Portal REST API (Developer Portal backend): native /portal, preserve. ----
        location /portal {
            proxy_pass http://management_api:8083;
        }

        # ---- Kibana: SERVER_BASEPATH=/kibana. Preserve path + websockets. ----
        location = /kibana { return 302 /kibana/; }
        location /kibana/ {
            proxy_pass http://kibana:5601;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ---- Grafana: GF_SERVER_SERVE_FROM_SUB_PATH under /grafana. Preserve + live websockets. ----
        location = /grafana { return 302 /grafana/; }
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ---- Prometheus: --web.external-url=/prometheus. Preserve path. ----
        location = /prometheus { return 302 /prometheus/; }
        location /prometheus/ {
            proxy_pass http://prometheus:9090;
        }

        # ---- Gateway: catch-all root. Preserves API context paths (/private-b, ...). ----
        location / {
            proxy_pass http://gateway:8082;
        }
    }
}
