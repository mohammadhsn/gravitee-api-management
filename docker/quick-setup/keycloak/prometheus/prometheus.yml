# Scrape Gravitee node metrics (Micrometer/Prometheus registry on the node API).
# Enabled via gravitee_services_metrics_enabled=true; node API uses basic auth admin/adminadmin.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'gio-gateway'
    metrics_path: /_node/metrics/prometheus
    basic_auth:
      username: admin
      password: adminadmin
    static_configs:
      - targets: ['gateway:18082']

  - job_name: 'gio-mgmt-api'
    metrics_path: /_node/metrics/prometheus
    basic_auth:
      username: admin
      password: adminadmin
    static_configs:
      - targets: ['management_api:18083']
