# kind cluster for local Gravitee APIM (Helm) deployment — single source of truth.
#
# Full workflow:
#   kind create cluster --config helm/kind/kind-cluster.yaml
#   helm/kind/load-images.sh                 # preload local + Bitnami images (kind has no native preload)
#   helm dependency build helm/              # fetch ES + Mongo subcharts
#   helm install apim helm/ -n gravitee --create-namespace -f helm/kind/values-kind.yaml
#   kind delete cluster --name gravitee-apim
#
# Single node: fits the ~6 GB Docker budget best (multi-node just splits the same
# RAM). To mimic the target 3-4 node cluster later, add `- role: worker` entries.
#
# The control-plane is labelled ingress-ready and maps host ports 8081/8444 -> 80/443
# so ingress-nginx (kind flavour) is reachable at http://localhost:8081.
# Host ports are 8081/8444 (NOT 80/443) to avoid clashing with the docker-compose
# edge nginx that already publishes :80 on this machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gravitee-apim
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
      - containerPort: 443
        hostPort: 8444
        protocol: TCP
