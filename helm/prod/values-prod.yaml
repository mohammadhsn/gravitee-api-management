# Production overlay — SINGLE-NODE data layer, same topology as the kind setup,
# but with real hostnames, production resources, and larger persistence.
# Layer it on the shared bugfix overlay:
#
#   helm install apim helm/ -n gravitee --create-namespace \
#     -f helm/deploy/values-common.yaml \
#     -f helm/prod/values-prod.yaml \
#     --kube-context <prod-context>
#
# Intentional design (confirmed): the DATA LAYER is single-node — Elasticsearch is one
# all-role node (no shard replicas), MongoDB is a 1-member replica set. This is a
# single point of failure by choice; durability comes from BACKUPS + fast recovery
# (mongodump / ES snapshot -> off-cluster S3, restore onto a fresh PVC), NOT from
# replication. Every Gravitee component is also 1 replica ("single everything").
# EDGE IS PRE-EXISTING: MetalLB and ingress-nginx are installed and owned by the platform
# on the prod cluster. This overlay does NOT create them — it only emits Ingress resources
# that ATTACH to the platform's controller via `ingressClassName` + host. So the values
# below must MATCH what that controller already expects (see helm/prod/DEPLOY-BAREMETAL.md
# §2 for the read-only discovery commands). Never patch the shared controller or its
# Service to suit this chart.
#
# TLS terminates at the ingress-nginx controller (the platform's MetalLB provides its L4
# VIP; nginx does HTTPS + L7 routing). All five ingresses share one certificate in the
# secret `apim-tls`, which lives in OUR namespace. It must EXIST before/at deploy:
#   - cert-manager: create ONE Certificate CR for host apim.example.com -> secret apim-tls
#     (do NOT scatter cert-manager.io/cluster-issuer across all 5 ingresses — they would
#      each spawn a Certificate fighting over the same secret). Or:
#   - pre-provisioned: kubectl -n gravitee create secret tls apim-tls --cert=... --key=...
#
# ┌─ BEFORE DEPLOYING, replace these placeholders ─────────────────────────────┐
# │  apim.example.com   -> your real prod host (appears in URLs + all ingresses)│
# │  apim-tls           -> a TLS secret for that host (cert-manager or manual)  │
# │  persistence.storageClass (commented) -> your cluster's node-local SC, or   │
# │     leave commented to use the cluster default StorageClass                 │
# │  ingressClassName: nginx -> MUST match the platform's existing IngressClass │
# │     (5 places). Verify with: kubectl get ingressclass — an unmatched class   │
# │     means the controller silently ignores our Ingresses (ADDRESS stays empty)│
# └────────────────────────────────────────────────────────────────────────────┘

# Real edge URLs. HTTPS on the standard port (:443) — TLS terminates at ingress-nginx —
# so no port appears in the URL. Set explicitly so every derived console/portal/API link
# is https and same-origin with the browser's address bar.
installation:
  api:
    url: https://apim.example.com
  standalone:
    console:
      urls:
        - orgId: DEFAULT
          url: https://apim.example.com/console
    portal:
      urls:
        - envId: DEFAULT
          url: https://apim.example.com/devportal

# ── MongoDB — 1-member replica set (single-node), production disk/resources ───
mongodb:
  enabled: true
  replicaCount: 1
  arbiter:
    enabled: false
  persistence:
    size: 20Gi
    # storageClass: <your-node-local-sc>   # omit -> cluster default
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { cpu: 1,    memory: 2Gi }

# ── Elasticsearch — 1 all-role node (single-node), production heap/disk ───────
elasticsearch:
  enabled: true
  master:
    masterOnly: false
    replicaCount: 1
    heapSize: 2048m
    persistence:
      size: 30Gi
      # storageClass: <your-node-local-sc>
    resources:
      requests: { cpu: 500m, memory: 3Gi }
      limits:   { cpu: 2,    memory: 4Gi }
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    replicaCount: 0

# Point the API at the single master node's headless service (the default ingest-hl
# service doesn't exist without dedicated ingest nodes), and keep 0 shard replicas so
# a single-node cluster is green (not yellow). Same as kind — single-node ES.
es:
  endpoints:
    - http://graviteeio-apim-elasticsearch-master-hl:9200
  settings:
    number_of_shards: 1
    number_of_replicas: 0

# ── Gravitee components — single everything ──────────────────────────────────
api:
  replicaCount: 1
  image:
    tag: "4.11.6"
    pullPolicy: IfNotPresent
  # portalURL is the one hardcoded-https spot with a value hook (api-configmap uses
  # api.portalURL verbatim when set); the other four were patched to honor ingress
  # scheme. Plain http for the internal edge.
  portalURL: https://apim.example.com
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2,    memory: 2Gi }
  ingress:
    management:
      ingressClassName: nginx
      scheme: https
      hosts:
        - apim.example.com
      tls:
        - hosts: [apim.example.com]
          secretName: apim-tls
    portal:
      ingressClassName: nginx
      scheme: https
      hosts:
        - apim.example.com
      tls:
        - hosts: [apim.example.com]
          secretName: apim-tls

gateway:
  replicaCount: 1
  image:
    tag: "4.11.6"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 500m, memory: 768Mi }
    limits:   { cpu: 2,    memory: 1536Mi }
  ingress:
    ingressClassName: nginx
    # scheme feeds the patched gateway-entrypoint templates (console try-it + API
    # portal.entrypoint); https now that TLS terminates at the ingress controller.
    scheme: https
    hosts:
      - apim.example.com
    tls:
      - hosts: [apim.example.com]
        secretName: apim-tls
    # Data-plane tuning: the gateway proxies real API traffic, so lift nginx's 1 MB
    # body cap and stretch timeouts for streaming / SSE / WebSocket / long-poll APIs.
    # (These belong ONLY on the gateway — the console/portal/mgmt ingresses don't need them.)
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"       # set "0" for unlimited (weigh DoS risk)
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

ui:
  replicaCount: 1
  image:
    tag: "4.11.6"
    pullPolicy: IfNotPresent
  # Console SPA calls the management API here (plain http, real host, standard port).
  baseURL: https://apim.example.com/management/
  ingress:
    ingressClassName: nginx
    # scheme feeds the patched portalURL derivation (api-configmap uses ui host).
    scheme: https
    hosts:
      - apim.example.com
    tls:
      - hosts: [apim.example.com]
        secretName: apim-tls
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

portal:
  replicaCount: 1
  image:
    tag: "latest"
    pullPolicy: IfNotPresent
  baseURL: https://apim.example.com/portal
  # ── Portal API URL: RELATIVE, on purpose ─────────────────────────────────────
  # The Portal SPA reads PORTAL_API_URL at container start. The chart builds that env
  # var as an ABSOLUTE url from api.ingress.portal (scheme://host/path/), and NOT from
  # portal.baseURL above — so baseURL alone cannot fix it. An absolute value means the
  # SPA calls that exact origin, and if the browser's origin differs in ANY component
  # (scheme, host/alias, or port) the bootstrap call becomes CROSS-ORIGIN and gets
  # blocked as CORS — even though /devportal and /portal are served by the same edge.
  #
  # A relative "/portal" resolves against whatever origin the page was loaded from, so
  # the call is same-origin by construction and CORS never engages. This is exactly what
  # the docker-compose stack does (PORTAL_API_URL=/portal in
  # docker/quick-setup/nginx/docker-compose.yml), which is why the problem never appears
  # there. It also makes the deploy immune to being reached via an alias, a raw IP, a
  # non-443 port, or a port-forward.
  #
  # This env entry is appended AFTER the chart's built-in PORTAL_API_URL, so the pod spec
  # carries the name twice and the LAST one wins. Untidy but deliberate — it is the only
  # way to override that value without patching the template.
  #
  # ONLY revert to an absolute URL if you ever serve the Portal UI and the Portal API
  # from DIFFERENT hosts. With this chart all five ingresses share one host, so relative
  # is correct.
  env:
    - name: PORTAL_API_URL
      value: /portal
  ingress:
    ingressClassName: nginx
    pathType: ImplementationSpecific
    path: /devportal(/.*)?
    hosts:
      - apim.example.com
    tls:
      - hosts: [apim.example.com]
        secretName: apim-tls
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
