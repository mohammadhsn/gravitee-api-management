# AIR-GAPPED overlay — repoints EVERY image at an internal registry.
# Layer it LAST, after common + prod:
#
#   helm install apim ./apim-4.11.0.tgz -n gravitee --create-namespace \
#     -f helm/deploy/values-common.yaml \
#     -f helm/prod/values-prod.yaml \
#     -f helm/prod/values-airgap.yaml
#
# ┌─ REPLACE THIS ONE VALUE ───────────────────────────────────────────────────┐
# │  registry.example.internal  ->  your internal registry host[:port]         │
# │  (appears once under global.imageRegistry and once per Gravitee component)  │
# └────────────────────────────────────────────────────────────────────────────┘
#
# There are TWO separate internet dependencies; this file only fixes the IMAGES.
# The Helm CHART dependencies (Bitnami elasticsearch + mongodb subcharts) are fixed by
# deploying a PACKAGED chart that already embeds them — see DEPLOY-BAREMETAL.md §A.
# Mirror the images first with helm/prod/mirror-images.sh (run on a connected host).

# ── Bitnami subcharts (mongodb, elasticsearch + their os-shell init images) ───
# Bitnami charts split image into registry + repository, and honour this ONE global.
# It covers all four Bitnami images at once: mongodb, elasticsearch, and the two
# os-shell tags used by sysctl / volume-permissions inits. Repository paths are
# preserved, so the mirror must keep them (…/bitnamilegacy/mongodb, etc.).
global:
  imageRegistry: registry.example.internal
  # allowInsecureImages stays true — inherited from values-common.yaml. The Bitnami
  # image guard rejects "non-standard" repos, and a mirrored path is non-standard too.
  #
  # Uncomment if the internal registry needs auth. Create the secret first:
  #   kubectl -n gravitee create secret docker-registry regcred \
  #     --docker-server=registry.example.internal \
  #     --docker-username=<user> --docker-password=<pass>
  # imagePullSecrets:
  #   - regcred

# ── Gravitee components ──────────────────────────────────────────────────────
# These templates render `image: "{{ .image.repository }}:{{ .image.tag }}"` with NO
# registry field, so the registry host must be baked into `repository`.
# pullPolicy IfNotPresent avoids a registry round-trip on every pod start; the internal
# registry is reachable, so Always would also work — IfNotPresent is just cheaper.
api:
  image:
    repository: registry.example.internal/graviteeio/apim-management-api
    tag: "4.11.6"
    pullPolicy: IfNotPresent
    # pullSecrets: regcred

gateway:
  image:
    repository: registry.example.internal/graviteeio/apim-gateway
    tag: "4.11.6"
    pullPolicy: IfNotPresent
    # pullSecrets: regcred

ui:
  image:
    repository: registry.example.internal/graviteeio/apim-management-ui
    tag: "4.11.6"
    pullPolicy: IfNotPresent
    # pullSecrets: regcred

portal:
  image:
    repository: registry.example.internal/graviteeio/apim-portal-ui
    # ⚠️ Upstream ships this component as `:latest` only — an unpinnable moving target
    # with no version label, which is exactly what an air-gapped install must not have.
    # mirror-images.sh therefore retags it to 4.11.6 INSIDE the internal registry, which
    # becomes the source of truth. Keep this pinned; never point it back at :latest.
    tag: "4.11.6"
    pullPolicy: IfNotPresent
    # pullSecrets: regcred
